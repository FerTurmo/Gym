<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Troya Gym Tracker</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--card2:#20242c;--border:#303641;--text:#f2f4f7;--muted:#9aa3af;--accent:#e0b15a;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
.container{max-width:1050px;margin:auto;padding:20px}header{margin-bottom:20px}h1{margin:0 0 5px;font-size:28px}h2,h3{margin-top:0}.subtitle{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px}.tab{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:11px 15px;border-radius:10px;cursor:pointer;white-space:nowrap;font-size:13px}.tab.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:bold}.tab.optional{border-style:dashed}
.day{display:none}.day.active{display:block}.day-type{display:inline-block;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:bold;margin-bottom:10px}.mandatory{background:#302717;color:var(--accent)}.optional{background:#17253a;color:var(--blue)}
.exercise{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}.exercise-header{padding:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card2)}.exercise-name{font-weight:bold;font-size:16px}.target{color:var(--muted);font-size:12px;margin-top:4px}
.previous{font-size:12px;color:#7f8794;text-align:right;line-height:1.45}.reference-label{color:#68717f;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.reference-values{color:#7f8794}
.series{padding:12px 16px 4px}.series-labels{display:grid;grid-template-columns:40px 1fr 1fr 40px;gap:8px;margin-bottom:7px;color:var(--muted);font-size:10px;text-transform:uppercase}.series-row{display:grid;grid-template-columns:40px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}.series-number{color:var(--muted);font-size:13px;text-align:center}
input{width:100%;background:#111318;border:1px solid var(--border);border-radius:8px;color:white;padding:10px;font-size:14px}input:focus{outline:none;border-color:var(--accent)}.delete-series{border:0;background:transparent;color:var(--red);font-size:20px;cursor:pointer;padding:5px}.add-series{margin:8px 16px 16px;width:calc(100% - 32px);padding:10px;border:1px dashed var(--border);background:transparent;color:var(--accent);border-radius:8px;cursor:pointer}.add-series:hover{background:var(--card2)}.exercise-footer{padding:0 16px 14px;color:var(--muted);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:bold}.primary{background:var(--accent);color:#111}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.danger{background:#351c1c;color:var(--red);border:1px solid #633030}.message{display:none;background:#17351f;color:var(--green);padding:12px;border-radius:9px;margin-bottom:15px}
.summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card2);padding:14px;border-radius:10px}.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px}.stat-value{font-size:18px;font-weight:bold}.history{margin-top:25px}.history-item{background:var(--card);border:1px solid var(--border);padding:14px;border-radius:10px;margin-bottom:8px}.history-date{font-weight:bold}.history-info{color:var(--muted);font-size:12px;margin-top:5px}.exercise-history{margin-top:20px}
select{background:var(--card2);color:white;border:1px solid var(--border);border-radius:8px;padding:10px;width:100%;margin-bottom:15px;font-size:16px}canvas{width:100%;max-height:300px;background:var(--card);border-radius:12px;border:1px solid var(--border)}.cardio-note{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:14px;margin-bottom:14px;color:var(--muted);font-size:13px}
@media(max-width:600px){.container{padding:12px}.summary-grid{grid-template-columns:1fr}.exercise-header{align-items:flex-start}.previous{max-width:160px}.series-row,.series-labels{grid-template-columns:30px 1fr 1fr 30px}input,select{font-size:16px}}
</style>
</head>
<body>
<div class="container">
<header><h1>🏛️ Troya Gym</h1><div class="subtitle">Entrenamiento · Progresión · Físico atlético</div></header>
<div class="tabs">
<button class="tab active" onclick="showDay(1)">1 · Push</button><button class="tab" onclick="showDay(2)">2 · Pull</button><button class="tab" onclick="showDay(3)">3 · Legs</button><button class="tab" onclick="showDay(4)">4 · Upper</button><button class="tab optional" onclick="showDay(5)">5 · Hombros + brazos</button><button class="tab optional" onclick="showDay(6)">6 · Espalda + pecho</button><button class="tab optional" onclick="showDay(7)">7 · Athletic</button>
</div>
<div id="message" class="message"></div>
<div class="controls"><button class="primary" onclick="saveWorkout()">💾 Guardar entrenamiento</button><button class="secondary" onclick="resetCurrentWorkout()">↩️ Restaurar</button><button class="secondary" onclick="exportData()">📤 Exportar</button><button class="secondary" onclick="document.getElementById('importFile').click()">📥 Importar</button><button class="danger" onclick="deleteAllData()">🗑️ Borrar datos</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></div>
<div id="days"></div>
<div class="summary"><h3>📊 Resumen</h3><div class="summary-grid"><div class="stat"><div class="stat-label">Sesiones totales</div><div class="stat-value" id="totalWorkouts">0</div></div><div class="stat"><div class="stat-label">Volumen última sesión</div><div class="stat-value" id="lastVolume">0 kg</div></div><div class="stat"><div class="stat-label">Comparación</div><div class="stat-value" id="comparison">—</div></div></div></div>
<div class="exercise-history"><h3>📈 Progreso por ejercicio</h3><select id="exerciseSelector" onchange="drawChart()"><option value="">Selecciona un ejercicio</option></select><canvas id="progressChart" width="900" height="300"></canvas></div>
<div class="history"><h3>📋 Historial</h3><div id="historyList"></div></div>
</div>
<script>
const STORAGE_KEY="troyaGymData";
const routine={
1:{name:"Pecho + hombros + tríceps",type:"mandatory",exercises:[["Press de pecho en máquina",3,"6-10"],["Press inclinado en máquina",3,"8-12"],["Pec Deck",2,"10-15"],["Elevación lateral en máquina",4,"10-15"],["Press de hombros en máquina",2,"8-12"],["Tríceps en polea",3,"10-15"],["Extensión de tríceps en máquina/polea",2,"10-15"]]},
2:{name:"Espalda + bíceps + abdomen",type:"mandatory",exercises:[["Jalón al pecho en máquina/polea",3,"8-12"],["Remo sentado en máquina",3,"8-12"],["Jalón unilateral en máquina/polea",2,"10-15"],["Reverse Pec Deck",3,"12-15"],["Curl de bíceps en máquina",3,"8-12"],["Curl predicador en máquina",2,"10-15"],["Crunch abdominal en máquina",3,"10-15"],["Elevación de piernas",2,"10-15"]]},
3:{name:"Piernas + abdomen",type:"mandatory",exercises:[["Prensa de piernas",3,"8-12"],["Curl femoral sentado",3,"8-12"],["Extensión de cuádriceps",2,"10-15"],["Hip Thrust en máquina",2,"8-12"],["Gemelos en máquina",3,"10-15"],["Crunch en máquina",3,"10-15"],["Abdominal lateral en máquina/polea",2,"12-15"]]},
4:{name:"Upper estético",type:"mandatory",exercises:[["Press inclinado en máquina",3,"8-12"],["Pec Deck",2,"10-15"],["Jalón al pecho",3,"8-12"],["Remo en máquina",2,"8-12"],["Elevación lateral en máquina",4,"10-15"],["Reverse Pec Deck",2,"12-15"],["Curl bíceps máquina",2,"10-15"],["Tríceps polea",2,"10-15"]]},
5:{name:"Hombros + brazos",type:"optional",exercises:[["Elevación lateral máquina",4,"10-15"],["Reverse Pec Deck",3,"12-15"],["Press hombros máquina",2,"8-12"],["Curl bíceps máquina",3,"8-12"],["Curl predicador",2,"10-15"],["Tríceps polea",3,"10-15"],["Extensión tríceps",2,"10-15"]]},
6:{name:"Espalda + pecho",type:"optional",exercises:[["Jalón al pecho",3,"8-12"],["Remo máquina",3,"8-12"],["Jalón unilateral",2,"10-15"],["Reverse Pec Deck",2,"12-15"],["Press inclinado máquina",3,"8-12"],["Press pecho máquina",2,"8-12"],["Pec Deck",2,"10-15"]]},
7:{name:"Athletic",type:"optional",exercises:[["Prensa de piernas",2,"10-15"],["Curl femoral",2,"10-15"],["Extensión de cuádriceps",2,"10-15"],["Gemelos",2,"12-15"],["Crunch máquina",3,"10-15"],["Elevación de piernas",2,"10-15"]]}
};
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"workouts":[]}');
let currentDay=1;
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function showMessage(text){const el=document.getElementById("message");el.textContent=text;el.style.display="block";setTimeout(()=>el.style.display="none",2500)}
function escapeHTML(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function exerciseKey(name){
 let s=String(name).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 s=s.replace(/\b(de|en|la|el|los|las|y)\b/g," ").replace(/\bmaquina\b/g," ").replace(/\bpolea\b/g," ").replace(/\bmachine\b/g," ").replace(/\s+/g," ").trim();
 const aliases={
  "press de pecho":"press pecho","press pecho":"press pecho","press inclinado":"press inclinado","press hombros":"press hombros","elevacion lateral":"elevacion lateral","curl biceps":"curl biceps","curl predicador":"curl predicador","triceps":"triceps","extension triceps":"extension triceps","jalon al pecho":"jalon al pecho","jalon unilateral":"jalon unilateral","remo sentado":"remo","remo":"remo","curl femoral sentado":"curl femoral","curl femoral":"curl femoral","extension de cuadriceps":"extension cuadriceps","extension cuadriceps":"extension cuadriceps","gemelos":"gemelos","prensa de piernas":"prensa de piernas","pec deck":"pec deck","reverse pec deck":"reverse pec deck","elevacion de piernas":"elevacion de piernas","crunch abdominal":"crunch","crunch":"crunch","hip thrust":"hip thrust","abdominal lateral":"abdominal lateral"};
 return aliases[s]||s;
}
function renderDays(){const container=document.getElementById("days");container.innerHTML="";for(let day=1;day<=7;day++){const d=document.createElement("div");d.className="day "+(day===currentDay?"active":"");d.id="day-"+day;const mandatory=routine[day].type==="mandatory";let html=`<div class="summary"><div class="day-type ${mandatory?"mandatory":"optional"}">${mandatory?"🔴 OBLIGATORIO":"🟡 OPCIONAL"}</div><h2>Día ${day} — ${routine[day].name}</h2><div class="subtitle">${mandatory?"Este día forma parte de tus 4 días base.":"Haz este día únicamente si esta semana entrenas más de 4 días."}</div></div>`;routine[day].exercises.forEach((e,i)=>html+=createExerciseHTML(day,i,e[0],e[1],e[2]));if(day===7)html+=`<div class="cardio-note"><strong>🏃 Cardio recomendado</strong><br><br>20–30 minutos de cardio moderado. Bicicleta, cinta inclinada, elíptica, caminar rápido, etc.<br><br>Este día debe sentirse más ligero que los días principales. No es necesario entrenar al fallo.</div>`;d.innerHTML=html;container.appendChild(d)}loadPreviousValues()}
function createExerciseHTML(day,index,name,defaultSets,reps){return `<div class="exercise"><div class="exercise-header"><div><div class="exercise-name">${escapeHTML(name)}</div><div class="target">Objetivo: ${defaultSets} × ${reps}</div></div><div class="previous" id="previous-${day}-${index}">Sin registro</div></div><div class="series" id="series-${day}-${index}"></div><button class="add-series" onclick="addSeries(${day},${index})">＋ Añadir serie</button><div class="exercise-footer" id="volume-${day}-${index}">Volumen: 0 kg</div></div>`}
function createSeriesRow(day,exercise,setNumber,weight="",reps=""){const row=document.createElement("div");row.className="series-row";row.innerHTML=`<div class="series-number">${setNumber}</div><input type="number" min="0" step="0.5" placeholder="Peso kg" value="${escapeHTML(weight)}" class="weight-input" oninput="updateExerciseVolume(${day},${exercise})"><input type="number" min="0" step="1" placeholder="Reps" value="${escapeHTML(reps)}" class="reps-input" oninput="updateExerciseVolume(${day},${exercise})"><button class="delete-series" onclick="deleteSeries(this,${day},${exercise})" title="Eliminar serie">×</button>`;return row}
function addSeries(day,exercise){const c=document.getElementById(`series-${day}-${exercise}`);c.appendChild(createSeriesRow(day,exercise,c.children.length+1));renumberSeries(day,exercise)}
function deleteSeries(button,day,exercise){const c=document.getElementById(`series-${day}-${exercise}`);if(c.children.length<=1){showMessage("Cada ejercicio debe tener al menos una serie.");return}button.parentElement.remove();renumberSeries(day,exercise);updateExerciseVolume(day,exercise)}
function renumberSeries(day,exercise){const c=document.getElementById(`series-${day}-${exercise}`);[...c.children].forEach((r,i)=>r.querySelector(".series-number").textContent=i+1)}
function updateExerciseVolume(day,exercise){const c=document.getElementById(`series-${day}-${exercise}`);let v=0;[...c.children].forEach(r=>{v+=(parseFloat(r.querySelector(".weight-input").value)||0)*(parseFloat(r.querySelector(".reps-input").value)||0)});document.getElementById(`volume-${day}-${exercise}`).textContent=`Volumen: ${formatNumber(v)} kg`}
function showDay(day){currentDay=day;document.querySelectorAll(".day").forEach(e=>e.classList.toggle("active",e.id==="day-"+day));document.querySelectorAll(".tab").forEach((tab,i)=>tab.classList.toggle("active",i+1===day))}
function getLastWorkout(day){return [...data.workouts].filter(w=>w.day===day).sort((a,b)=>new Date(b.date)-new Date(a.date))[0]||null}
function getLastExerciseRecord(name){const key=exerciseKey(name);const workouts=[...data.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date));for(const w of workouts){const ex=(w.exercises||[]).find(e=>exerciseKey(e.name)===key&&Array.isArray(e.sets)&&e.sets.some(s=>s.weight!==""||s.reps!==""));if(ex)return ex}return null}
function formatReference(ex){if(!ex||!Array.isArray(ex.sets))return "";return ex.sets.filter(s=>s.weight!==""||s.reps!=="").map(s=>`${s.weight!==""?s.weight:"—"} kg × ${s.reps!==""?s.reps:"—"} reps`).join(" · ")}
function loadPreviousValues(){for(let day=1;day<=7;day++){routine[day].exercises.forEach((exercise,index)=>{const c=document.getElementById(`series-${day}-${index}`);if(!c)return;c.innerHTML="";for(let i=0;i<exercise[1];i++)c.appendChild(createSeriesRow(day,index,i+1,"",""));const previous=document.getElementById(`previous-${day}-${index}`);const ex=getLastExerciseRecord(exercise[0]);if(ex){previous.innerHTML=`<span class="reference-label">Referencia</span><br><span class="reference-values">${escapeHTML(formatReference(ex))}</span>`}else previous.textContent="Sin registro";updateExerciseVolume(day,index)})}}
function collectDay(day){return routine[day].exercises.map((exercise,index)=>{const c=document.getElementById(`series-${day}-${index}`);return{name:exercise[0],sets:[...c.children].map(row=>({weight:row.querySelector(".weight-input").value,reps:row.querySelector(".reps-input").value}))}})}
function saveWorkout(){const exercises=collectDay(currentDay);if(!exercises.some(e=>e.sets.some(s=>s.weight!==""||s.reps!==""))){showMessage("Introduce al menos una serie antes de guardar.");return}data.workouts.push({id:Date.now(),date:new Date().toISOString(),day:currentDay,exercises});saveData();updateSummary();updateHistory();populateExerciseSelector();renderDays();showDay(currentDay);drawChart();showMessage("✅ Entrenamiento guardado correctamente.")}
function calculateExerciseVolume(ex){if(!ex||!Array.isArray(ex.sets))return 0;return ex.sets.reduce((t,s)=>t+(parseFloat(s.weight)||0)*(parseFloat(s.reps)||0),0)}
function calculateWorkoutVolume(w){return (w.exercises||[]).reduce((t,e)=>t+calculateExerciseVolume(e),0)}
function formatNumber(n){return Number(n||0).toLocaleString("es-ES",{maximumFractionDigits:1})}
function updateSummary(){const ws=[...data.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById("totalWorkouts").textContent=ws.length;if(!ws.length){document.getElementById("lastVolume").textContent="0 kg";document.getElementById("comparison").textContent="—";return}const latest=ws[0],lv=calculateWorkoutVolume(latest);document.getElementById("lastVolume").textContent=formatNumber(lv)+" kg";const previous=ws.find(w=>w.day===latest.day&&w.id!==latest.id);if(!previous){document.getElementById("comparison").textContent="Primera sesión";return}const pv=calculateWorkoutVolume(previous);if(!pv){document.getElementById("comparison").textContent="—";return}const pct=((lv-pv)/pv)*100;document.getElementById("comparison").textContent=(pct>=0?"+":"")+pct.toFixed(1)+"%"}
function resetCurrentWorkout(){if(!confirm("¿Vaciar las series del día actual y mantener las referencias anteriores?"))return;renderDays();showDay(currentDay);showMessage("Sesión restaurada: campos vacíos y referencias actualizadas.")}
function updateHistory(){const c=document.getElementById("historyList"),ws=[...data.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date));if(!ws.length){c.innerHTML='<div class="history-item">Todavía no tienes entrenamientos guardados.</div>';return}c.innerHTML="";ws.forEach(w=>{const item=document.createElement("div");item.className="history-item";item.innerHTML=`<div class="history-date">Día ${w.day} — ${escapeHTML(routine[w.day].name)}</div><div class="history-info">${new Date(w.date).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"})} · ${formatNumber(calculateWorkoutVolume(w))} kg de volumen</div>`;c.appendChild(item)})}
function populateExerciseSelector(){const s=document.getElementById("exerciseSelector"),current=s.value;s.innerHTML='<option value="">Selecciona un ejercicio</option>';const names=[];Object.values(routine).forEach(d=>d.exercises.forEach(e=>{if(!names.includes(e[0]))names.push(e[0])}));names.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o)});if(names.includes(current))s.value=current}
function drawChart(){const name=document.getElementById("exerciseSelector").value,canvas=document.getElementById("progressChart"),ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);if(!name){ctx.fillStyle="#9aa3af";ctx.font="16px Arial";ctx.textAlign="center";ctx.fillText("Selecciona un ejercicio",canvas.width/2,canvas.height/2);return}const key=exerciseKey(name),records=[];[...data.workouts].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(w=>(w.exercises||[]).forEach(e=>{if(exerciseKey(e.name)===key)records.push({date:new Date(w.date),volume:calculateExerciseVolume(e)})}));if(!records.length){ctx.fillStyle="#9aa3af";ctx.font="16px Arial";ctx.textAlign="center";ctx.fillText("Todavía no hay datos",canvas.width/2,canvas.height/2);return}const p=55,cw=canvas.width-p*2,ch=canvas.height-p*2,max=Math.max(...records.map(r=>r.volume),1);ctx.strokeStyle="#303641";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p,p);ctx.lineTo(p,canvas.height-p);ctx.lineTo(canvas.width-p,canvas.height-p);ctx.stroke();ctx.strokeStyle="#e0b15a";ctx.lineWidth=3;ctx.beginPath();records.forEach((r,i)=>{const x=p+(records.length===1?cw/2:i/(records.length-1)*cw),y=canvas.height-p-r.volume/max*ch;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="#e0b15a";records.forEach((r,i)=>{const x=p+(records.length===1?cw/2:i/(records.length-1)*cw),y=canvas.height-p-r.volume/max*ch;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()});ctx.fillStyle="#9aa3af";ctx.font="12px Arial";ctx.textAlign="left";ctx.fillText(formatNumber(max)+" kg",8,p+5)}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="troya-gym-backup.json";a.click();URL.revokeObjectURL(url);showMessage("Datos exportados.")}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const imported=JSON.parse(e.target.result);if(!imported||!Array.isArray(imported.workouts))throw new Error();data=imported;saveData();renderDays();updateSummary();updateHistory();populateExerciseSelector();drawChart();showMessage("Datos importados correctamente.")}catch(error){alert("No se pudo importar el archivo.")}};reader.readAsText(file);event.target.value=""}
function deleteAllData(){if(!confirm("¿Seguro que quieres borrar TODO el historial? Esta acción no se puede deshacer."))return;data={workouts:[]};saveData();renderDays();updateSummary();updateHistory();populateExerciseSelector();drawChart();showMessage("Todos los datos han sido eliminados.")}
renderDays();updateSummary();updateHistory();populateExerciseSelector();drawChart();
</script>
</body>
</html>
