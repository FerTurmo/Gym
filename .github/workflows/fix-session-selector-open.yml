name: Fix GymPro session selector display
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep selected session open
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text()
          old="document.querySelectorAll('.workout').forEach(function(w){if(w.dataset.gpCollapsible==='1')return;"
          new="document.querySelectorAll('.workout:not(.gp-session-workout)').forEach(function(w){if(w.dataset.gpCollapsible==='1')return;"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          else:
              print('selector already fixed or pattern absent')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add GymPro.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep selected GymPro session expanded"
          git push
