name: Update gym reference UI

on:
  push:
    paths:
      - ".gym-ui-trigger"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gym.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("gym.html")
          s = p.read_text(encoding="utf-8")

          s = s.replace('''\n.previous{\n  font-size:12px;\n  color:#7f8794;\n  text-align:right;\n  line-height:1.45;\n}\n\n.reference-label{\n  color:#68717f;\n  font-size:10px;\n  text-transform:uppercase;\n  letter-spacing:.04em;\n}\n\n.reference-values{\n  color:#7f8794;\n}\n''', '\n')

          s = s.replace('''\n  .previous{\n    max-width:130px;\n  }\n''', '\n')

          s = s.replace('''\ninput:focus{\n  outline:none;\n  border-color:var(--accent);\n}\n''', '''\ninput::placeholder{\n  color:#7f8794;\n  opacity:1;\n}\n\ninput:focus{\n  outline:none;\n  border-color:var(--accent);\n}\n''')

          old_header = '''        <div\n          class="previous"\n          id="previous-${day}-${index}"\n        >\n          Sin registro\n        </div>\n'''
          if old_header not in s:
              raise SystemExit("exercise header reference block not found")
          s = s.replace(old_header, "", 1)

          old_sig = '''function createSeriesRow(\n  day,\n  exercise,\n  setNumber,\n  weight="",\n  reps=""\n){'''
          new_sig = '''function createSeriesRow(\n  day,\n  exercise,\n  setNumber,\n  weight="",\n  reps="",\n  referenceWeight="",\n  referenceReps=""\n){'''
          if old_sig not in s:
              raise SystemExit("createSeriesRow signature not found")
          s = s.replace(old_sig, new_sig, 1)

          old_inputs = '''    <input\n      type="number"\n      min="0"\n      step="0.5"\n      placeholder="Peso kg"\n      value="${weight}"'''
          new_inputs = '''    <input\n      type="number"\n      min="0"\n      step="0.5"\n      placeholder="${referenceWeight !== "" ? `Peso kg (${escapeHTML(referenceWeight)})` : "Peso kg"}"\n      value="${weight}"'''
          if old_inputs not in s:
              raise SystemExit("weight input not found")
          s = s.replace(old_inputs, new_inputs, 1)

          old_reps = '''    <input\n      type="number"\n      min="0"\n      step="1"\n      placeholder="Reps"\n      value="${reps}"'''
          new_reps = '''    <input\n      type="number"\n      min="0"\n      step="1"\n      placeholder="${referenceReps !== "" ? `Reps (${escapeHTML(referenceReps)})` : "Reps"}"\n      value="${reps}"'''
          if old_reps not in s:
              raise SystemExit("reps input not found")
          s = s.replace(old_reps, new_reps, 1)

          start = s.index('function loadPreviousValues(){')
          end = s.index('\n\n\n/* =========================================================\n   RECOGER DATOS', start)
          new_load = '''function loadPreviousValues(){\n\n  for(let day=1; day<=7; day++){\n\n    routine[day].exercises\n      .forEach((exercise,index)=>{\n\n        const container =\n          document.getElementById(`series-${day}-${index}`);\n\n        if(!container) return;\n\n        container.innerHTML = "";\n\n        const previousExercise =\n          getLastExerciseRecord(exercise[0]);\n\n        const previousSets =\n          previousExercise && Array.isArray(previousExercise.sets)\n            ? previousExercise.sets.filter(set =>\n                set.weight !== "" || set.reps !== ""\n              )\n            : [];\n\n        for(let i=0; i<exercise[1]; i++){\n\n          const previousSet =\n            previousSets[i] || {weight:"", reps:""};\n\n          container.appendChild(\n            createSeriesRow(\n              day,\n              index,\n              i+1,\n              "",\n              "",\n              previousSet.weight ?? "",\n              previousSet.reps ?? ""\n            )\n          );\n\n        }\n\n        updateExerciseVolume(day,index);\n      });\n  }\n\n}'''
          s = s[:start] + new_load + s[end:]

          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          rm -f .gym-ui-trigger .github/workflows/update-reference-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gym.html .gym-ui-trigger .github/workflows/update-reference-ui.yml
          git diff --cached --quiet || git commit -m "Improve exercise reference placeholders"
          git push
