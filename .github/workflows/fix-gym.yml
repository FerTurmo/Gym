name: Fix gym reference placeholders
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gym.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gym.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''\n.previous{\n  font-size:12px;\n  color:#7f8794;\n  text-align:right;\n  line-height:1.45;\n}\n\n.reference-label{\n  color:#68717f;\n  font-size:10px;\n  text-transform:uppercase;\n  letter-spacing:.04em;\n}\n\n.reference-values{\n  color:#7f8794;\n}\n''','\n')
          s=s.replace('''\n  .previous{\n    max-width:130px;\n  }\n''','\n')
          s=s.replace('''input:focus{\n  outline:none;\n  border-color:var(--accent);\n}''','''input::placeholder{\n  color:#7f8794;\n  opacity:1;\n}\n\ninput:focus{\n  outline:none;\n  border-color:var(--accent);\n}''')
          s=s.replace('''        <div\n          class="previous"\n          id="previous-${day}-${index}"\n        >\n          Sin registro\n        </div>\n''','')
          s=s.replace('''function createSeriesRow(\n  day,\n  exercise,\n  setNumber,\n  weight="",\n  reps=""\n){''','''function createSeriesRow(\n  day,\n  exercise,\n  setNumber,\n  weight="",\n  reps="",\n  referenceWeight="",\n  referenceReps=""\n){''')
          s=s.replace('''placeholder="Peso kg"''','''placeholder="${referenceWeight !== "" ? `Peso kg (${escapeHTML(referenceWeight)})` : "Peso kg"}"''',1)
          s=s.replace('''placeholder="Reps"''','''placeholder="${referenceReps !== "" ? `Reps (${escapeHTML(referenceReps)})` : "Reps"}"''',1)
          a=s.index('function loadPreviousValues(){')
          b=s.index('\n\n\n/* =========================================================\n   RECOGER DATOS',a)
          new='''function loadPreviousValues(){\n\n  for(let day=1; day<=7; day++){\n    routine[day].exercises.forEach((exercise,index)=>{\n      const container=document.getElementById(`series-${day}-${index}`);\n      if(!container) return;\n      container.innerHTML="";\n      const previousExercise=getLastExerciseRecord(exercise[0]);\n      const previousSets=previousExercise && Array.isArray(previousExercise.sets)\n        ? previousExercise.sets.filter(set=>set.weight!=="" || set.reps!=="")\n        : [];\n      for(let i=0;i<exercise[1];i++){\n        const previousSet=previousSets[i] || {weight:"",reps:""};\n        container.appendChild(createSeriesRow(day,index,i+1,"","",previousSet.weight ?? "",previousSet.reps ?? ""));\n      }\n      updateExerciseVolume(day,index);\n    });\n  }\n\n}'''
          s=s[:a]+new+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gym.html
          git diff --cached --quiet || git commit -m "Put previous gym values in input placeholders"
          git push
          rm -f .github/workflows/fix-gym.yml .gym-ui-trigger
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary gym update workflow"
          git push
