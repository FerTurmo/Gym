name: Fix weekly patch state
on:
  push:
    paths:
      - '.github/workflows/fix-week-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text(encoding='utf-8')
          reps={
            "const S=JSON.parse(localStorage.getItem(KEY)||'{}');":"const S=window.S=JSON.parse(localStorage.getItem(KEY)||'{}');",
            "if(!s.weekStartDate||!Array.isArray(s.sessionStatus))return;":"if(!s.weekStartDate||!s.sessionStatus)return;",
            "status:[...s.sessionStatus]":"status:{...s.sessionStatus}",
            "s.sessionStatus=[];s.gpCurrentWeek=w;":"s.sessionStatus={};s.nextSession=1;s.gpCurrentWeek=w;",
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit('Missing target: '+a)
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GymPro.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix weekly state persistence'
          git push
