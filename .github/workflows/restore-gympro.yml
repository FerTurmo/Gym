name: Restore GymPro and set first-session reps target
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous GymPro and update first-session target
        run: |
          git checkout 8011ab3df927891ee59391f1cd68907d2b7edad6 -- GymPro.html
          python - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text()
          old="if(!hasHistory){return{weight:'',reps:p.lo,reason:'Primera vez en esta máquina; empieza con un peso cómodo y conservador.'}}"
          new="if(!hasHistory){return{weight:'',reps:p.hi,reason:'Primera vez en esta máquina; empieza con un peso cómodo y conservador.'}}"
          if old not in s:
              raise SystemExit('Expected recommendation branch not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GymPro.html
          git commit -m "Use top of rep range for first session"
          git push
