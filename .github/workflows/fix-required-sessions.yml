name: Fix required session count
on:
  push:
    paths:
      - '.github/workflows/fix-required-sessions.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch weekly session model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text()

          # The selected number of training days is the required number.
          # GymPro should always expose up to 7 sessions, with any sessions
          # above the selected number marked optional.
          marker='function finishConfig()'
          start=s.find(marker)
          if start<0:
              raise SystemExit('finishConfig not found')
          end=s.find('function ',start+10)
          if end<0:
              raise SystemExit('Could not find end of finishConfig')
          block=s[start:end]

          if 'GP_WEEKLY_SESSION_MODEL' not in block:
              block += '''\n// GP_WEEKLY_SESSION_MODEL\n// The user's selected training frequency is the number of mandatory sessions.\n// The weekly selector always offers seven slots; sessions above the selected\n// frequency are optional and never block weekly progression.\nfunction gpApplyWeeklySessionModel(){\n  const selected=Number(S.maxDays||S.minDays||1);\n  S.minDays=Math.max(1,Math.min(7,selected));\n  S.maxDays=7;\n}\n'''
              s=s[:start]+block+s[end:]

          # Inject the normalization immediately after the existing config save.
          # This avoids changing any of the existing onboarding UI/selection code.
          if 'gpApplyWeeklySessionModel();' not in s:
              target='function finishConfig()'
              pos=s.find(target)
              brace=s.find('{',pos)
              depth=0
              close=-1
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          close=i+1
                          break
              if close<0:
                  raise SystemExit('finishConfig closing brace not found')
              s=s[:close]+"\ngpApplyWeeklySessionModel();"+s[close:]

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GymPro.html
          git diff --cached --quiet || git commit -m 'Make selected training days mandatory and add optional sessions'
          git push
