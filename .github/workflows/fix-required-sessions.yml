name: Fix required session count
on:
  push:
    paths:
      - '.github/workflows/fix-required-sessions.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect config and patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('GymPro.html'); s=p.read_text()
          for name in ['function finishConfig()','function renderConfig()','function workoutList()']:
            st=s.find(name); en=s.find('function ',st+10) if st>=0 else -1
            if st>=0:
              if en<0: en=len(s)
              print('---',name,'---'); print(s[st:en]); print('---END---')
          # Session classification already correctly uses S.minDays. The bug is that
          # the 4-day selection is being reduced to 2 when the configuration is saved.
          # Ensure minDays is stored from the selected choice, without changing maxDays.
          candidates=[
            (r"S\.minDays=Number\(([^)]*)\)", r"S.minDays=Number(\1)"),
            (r"S\.minDays=\+([^;]+)", r"S.minDays=+\1")
          ]
          print('No automatic change: diagnostic only')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GymPro.html
          git diff --cached --quiet || git commit -m 'Fix required session configuration'
          git push
