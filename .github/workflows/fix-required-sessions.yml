name: Fix required session count
on:
  push:
    paths:
      - '.github/workflows/fix-required-sessions.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch weekly session model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text()

          # Remove a previous misplaced global call, if present.
          s=s.replace('\ngpApplyWeeklySessionModel();', '')

          # Ensure the normalization helper exists.
          if 'function gpApplyWeeklySessionModel()' not in s:
              marker='function finishConfig()'
              start=s.find(marker)
              if start<0: raise SystemExit('finishConfig not found')
              brace=s.find('{',start)
              depth=0; close=-1
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: close=i+1; break
              helper='''\nfunction gpApplyWeeklySessionModel(){\n  const selected=Number(S.maxDays||S.minDays||1);\n  S.minDays=Math.max(1,Math.min(7,selected));\n  S.maxDays=7;\n}\n'''
              s=s[:close]+helper+s[close:]

          # Find finishConfig and put the model application INSIDE it, immediately
          # before its closing brace. This means it runs only after the user saves
          # their selected training frequency.
          marker='function finishConfig()'
          start=s.find(marker)
          if start<0: raise SystemExit('finishConfig not found')
          brace=s.find('{',start)
          depth=0; close=-1
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: close=i; break
          if close<0: raise SystemExit('finishConfig closing brace not found')
          before=s[:close]
          if 'gpApplyWeeklySessionModel();' not in before[start:close]:
              s=s[:close]+'gpApplyWeeklySessionModel();'+s[close:]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GymPro.html
          git diff --cached --quiet || git commit -m 'Make selected training days mandatory and add optional sessions'
          git push
