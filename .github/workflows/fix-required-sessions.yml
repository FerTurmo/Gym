name: Fix required session count
on:
  push:
    paths:
      - '.github/workflows/fix-required-sessions.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix session generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text()
          old='function workoutList(){let n=S.maxDays||1,min=S.minDays||1,Ss=S.sessionStatus||{};'
          new='function workoutList(){let n=7,min=Number(S.maxDays||S.minDays||1),Ss=S.sessionStatus||{};'
          if old not in s:
              raise SystemExit('Expected workoutList pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GymPro.html
          git diff --cached --quiet || git commit -m 'Make selected training days mandatory and add optional sessions'
          git push
