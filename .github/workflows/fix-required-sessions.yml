name: Fix required session count
on:
  push:
    paths:
      - '.github/workflows/fix-required-sessions.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch session classification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('GymPro.html')
          s=p.read_text()
          start=s.find('function workoutList()')
          end=s.find('function ', start+10) if start>=0 else -1
          if start<0: raise SystemExit('workoutList not found')
          if end<0: end=len(s)
          block=s[start:end]
          old=block
          block=re.sub(r"i<2(?=\?['\"]required)", "i<Number(S.minDays||2)", block)
          block=re.sub(r"i===0&&['\"]required['\"]|i===0\?['\"]required['\"]", "i<Number(S.minDays||2)?'required'", block)
          if block==old:
            print('NO_CHANGE')
            print(block[:5000])
            raise SystemExit(2)
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GymPro.html
          git diff --cached --quiet || git commit -m 'Make required sessions match weekly training days'
          git push
