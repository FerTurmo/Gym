name: Simplify GymPro session buttons
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch session labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text(encoding='utf-8')
          old="nav+=`<button type=\"button\" class=\"gp-session-pill ${cls}\" data-session=\"${i}\" onclick=\"selectSession(${i})\">${i+1}<small>${done?'COMPLETADA':optional?'OPCIONAL':'OBLIGATORIA'}</small></button>`"
          new="nav+=`<button type=\"button\" class=\"gp-session-pill ${cls}\" data-session=\"${i}\" onclick=\"selectSession(${i})\">S.${i+1}</button>`"
          if old not in s:
              raise SystemExit('Expected session label code not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GymPro.html
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify GymPro session buttons'
          git push