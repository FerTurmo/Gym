name: Fix GymPro render freeze
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch GymPro
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<button class="tab active" onclick="tab(\'next\',this)">Siguiente</button>','<button class="tab active" onclick="tab(\'next\',this)">Entrenamiento</button>',1)
          start='<script>(function(){function polishGymProUI(){'
          end='</script></body></html>'
          i=s.find(start)
          if i<0:
              raise SystemExit('polish script start not found')
          j=s.find(end,i)
          if j<0:
              raise SystemExit('polish script end not found')
          s=s[:i]+end
          old="const pill=document.querySelector(`.gp-session-pill[data-session=\\\"${sessionIndex}\\\"]`);"
          new="const pill=document.querySelector('.gp-session-pill[data-session=\\\"'+sessionIndex+'\\\"]');"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GymPro.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix GymPro render freeze'
          git push
