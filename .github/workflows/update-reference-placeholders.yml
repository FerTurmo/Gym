name: Update gym reference UI

on:
  push:
    paths:
      - '.github/workflows/update-reference-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update gym.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('gym.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'\n\s*<div class="previous" id="previous-\$\{day\}-\$\{index\}">Sin registro</div>', '', s, count=1)
          s = re.sub(r'\n\.previous\{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\n\.reference-label\{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\n\.reference-values\{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*\.previous\{\n\s*max-width:130px;\n\s*\}\n', '\n', s, count=1)

          if 'input::placeholder' not in s:
              s = s.replace('input{\n  width:100%;', 'input::placeholder{\n  color:#7f8794;\n  opacity:1;\n}\n\ninput{\n  width:100%;', 1)

          pattern = r'function createSeriesRow\(.*?\n\}\n\nfunction addSeries'
          replacement = '''function createSeriesRow(day,index,setNumber,weight="",reps="",referenceWeight="",referenceReps=""){
  const weightPlaceholder = referenceWeight !== "" ? `Peso kg (${referenceWeight})` : "Peso kg";
  const repsPlaceholder = referenceReps !== "" ? `Reps (${referenceReps})` : "Reps";
  const row = document.createElement("div");
  row.className = "series-row";
  row.innerHTML = `
    <div class="series-number">${setNumber}</div>
    <input type="number" inputmode="decimal" step="0.5" placeholder="${escapeHTML(weightPlaceholder)}" value="${escapeHTML(weight)}">
    <input type="number" inputmode="numeric" step="1" placeholder="${escapeHTML(repsPlaceholder)}" value="${escapeHTML(reps)}">
    <button class="delete-series" onclick="this.parentElement.remove();updateExerciseVolume(${day},${index})">×</button>
  `;
  return row;
}

function addSeries'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find createSeriesRow block')

          pattern = r'function loadPreviousValues\(\)\{.*?\n\}\n\nfunction saveWorkout'
          replacement = '''function loadPreviousValues(){
  for(let day=1; day<=7; day++){
    routine[day].exercises.forEach((exercise,index)=>{
      const container = document.getElementById(`series-${day}-${index}`);
      if(!container) return;
      container.innerHTML = "";
      const previousExercise = getLastExerciseRecord(exercise[0]);
      const previousSets = previousExercise && Array.isArray(previousExercise.sets)
        ? previousExercise.sets.filter(set => set.weight !== "" || set.reps !== "")
        : [];
      for(let i=0; i<exercise[1]; i++){
        const previousSet = previousSets[i] || {weight:"", reps:""};
        container.appendChild(createSeriesRow(
          day,index,i+1,"","",previousSet.weight ?? "",previousSet.reps ?? ""
        ));
      }
      updateExerciseVolume(day,index);
    });
  }
}

function saveWorkout'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find loadPreviousValues block')

          s = re.sub(r'\n\s*const previousBox = document\.getElementById\(`previous-\$\{day\}-\$\{index\}`\);.*?\n\s*\}\n', '\n', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-reference-placeholders.yml
          git add gym.html
          git diff --cached --check
          git commit -m "fix: show previous values as input placeholders"
          git push
