name: Fix GymPro final

on:
  push:
    paths:
      - 'GymPro.html'
      - '.github/workflows/fix-gympro-final.yml'

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix GymPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('GymPro.html')
          s=p.read_text()
          s=s.replace('<button class="tab active" onclick="tab(\'next\',this)">Siguiente</button>','<button class="tab active" onclick="tab(\'next\',this)">Entrenamiento</button>')
          old="const p=prescription(x),h=exerciseHistory(x),hasHistory=Array.isArray(S.workoutHistory)&&S.workoutHistory.length>0;if(!hasHistory){return{weight:'',reps:p.hi,reason:'Primera vez en esta máquina; empieza con un peso cómodo y conservador.'}}"
          new="const p=prescription(x),h=exerciseHistory(x);if(!h){return{weight:'',reps:p.hi,reason:'Primera vez en esta máquina; empieza con un peso cómodo y conservador.'}}"
          s=s.replace(old,new,1)
          s=re.sub(r"<script>\(function\(\)\{function polishGymProUI\(\).*?</script>","",s,count=1,flags=re.S)
          s=s.replace("const pill=document.querySelector(`.gp-session-pill[data-session=\\\"${sessionIndex}\\\"]`);if(pill){pill.classList.remove('required','optional');pill.classList.add('completed');pill.querySelector('small').textContent='COMPLETADA'}","const pill=document.querySelector(`.gp-session-pill[data-session=\\\"${sessionIndex}\\\"]`);if(pill){pill.classList.remove('required','optional');pill.classList.add('completed')}",1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GymPro.html
          git diff --cached --quiet || git commit -m 'Fix GymPro loading and first-machine recommendations'
          git push
