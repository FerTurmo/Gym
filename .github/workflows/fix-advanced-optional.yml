name: Fix advanced customization optional
on:
  push:
    paths:
      - '.github/workflows/fix-advanced-optional.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch GymPro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GymPro.html')
          s=p.read_text()
          old="function configNext(){S.minDays=Number(S.minDays);S.maxDays=7;S.advanced=el('advancedCheck').checked;if(!Number.isInteger(S.minDays)||S.minDays<1||S.minDays>7||!S.duration||!S.location){el('e4').style.display='block';return}el('e4').style.display='none';save();S.advanced?show('advanced',5):finishPlan()}"
          new="function configNext(){S.minDays=Number(S.minDays);S.maxDays=7;S.advanced=el('advancedCheck').checked;if(!Number.isInteger(S.minDays)||S.minDays<1||S.minDays>7||!S.duration||!S.location){el('e4').style.display='block';return}el('e4').style.display='none';save();if(S.advanced){show('advanced',5)}else{finishPlan()}}"
          if old not in s:
              raise SystemExit('Target configNext function not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GymPro.html
          git commit -m 'Make advanced customization optional' || exit 0
          git push