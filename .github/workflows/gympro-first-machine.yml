name: Clean GymPro UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean temporary session selector code
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('GymPro.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="gp-session-selector">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="gp-session-ui">.*?</script>','',s,flags=re.S)
          s=s.replace("if(b.textContent.trim()==='Siguiente'){b.textContent='Entrenamiento →';}","var t=b.textContent.trim();if(t==='Siguiente'||t==='Entrenamiento →'){b.textContent='Entrenamiento';}",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GymPro.html
          if git diff --cached --quiet; then echo "No GymPro changes needed"; else git commit -m "Clean broken GymPro session selector"; git push; fi
